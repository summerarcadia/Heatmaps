<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hayley's Daily Accountability</title>
  <meta name="description" content="Daily study habits, tracked in public.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="title">Hayley's Daily Accountability</h1>
      <p class="sub">Daily study habits, tracked in public.</p>
    </header>

    <div id="habits" aria-live="polite"><p class="muted">Loading…</p></div>

    <footer>
      <div id="login" hidden>
        <form id="login-form">
          <label for="token">GitHub token</label>
          <div class="row">
            <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
            <button type="submit">Save</button>
            <button type="button" id="login-cancel" class="ghost">Cancel</button>
          </div>
          <p class="muted small">Stored only in this browser. Needs "Contents: Read and write" on this repo.</p>
          <p id="login-status" class="small"></p>
        </form>
      </div>
      <p class="small muted">
        <span id="owner-state"></span>
        <button type="button" id="login-toggle" class="link">Log in</button>
      </p>
    </footer>
  </main>

  <template id="habit-template">
    <section class="habit">
      <div class="habit-head">
        <h2 class="habit-name"></h2>
        <span class="habit-meta muted small"></span>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label">Today</span><span class="stat-value" data-stat="today"></span></div>
        <div class="stat"><span class="stat-label">Current streak</span><span class="stat-value" data-stat="current"></span></div>
        <div class="stat"><span class="stat-label">Longest streak</span><span class="stat-value" data-stat="longest"></span></div>
        <div class="stat"><span class="stat-label">Daily average</span><span class="stat-value" data-stat="average"></span></div>
      </div>
      <div class="map-scroll">
        <div class="map">
          <div class="months"></div>
          <div class="weekdays"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
          <div class="grid" role="img"></div>
        </div>
      </div>
      <div class="map-foot small">
        <span class="detail muted">Tap a square for details.</span>
        <span class="legend muted">Less <span class="legend-cells"></span> More</span>
      </div>
      <div class="controls" hidden>
        <div class="quick"></div>
        <details>
          <summary class="small">Edit a day</summary>
          <form class="edit-form row">
            <input type="date" class="edit-date" required>
            <input type="number" class="edit-count" min="0" step="1" inputmode="numeric" required>
            <button type="submit">Save</button>
          </form>
        </details>
        <p class="status small"></p>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
